name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build worklet
        run: pnpm build:worklet

      # --expose-gc is required: the zero-allocation test asserts gc() exists and
      # fails loudly rather than silently measuring framework garbage.
      - name: DSP test suite
        run: NODE_OPTIONS=--expose-gc npx vitest run

      - name: Production build
        run: pnpm build
